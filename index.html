<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スマート レシート for 弥生</title>
  </head>
  <body>
    <div id="app" class="min-h-screen bg-gray-50" x-data="receiptApp" x-init="init()">
      <div class="container mx-auto px-4 py-8 max-w-lg">
        <h1 class="text-3xl font-bold text-center mb-8">スマート レシート for 弥生</h1>
        
        <!-- エラーメッセージ -->
        <div x-show="error" x-transition class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
          <p x-text="error"></p>
        </div>
        
        <!-- カメラビュー -->
        <div x-show="!photo && cameraActive" class="mb-4">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- ビデオエリア -->
            <div class="relative bg-black" style="min-height: 400px;">
              <video 
                x-ref="video"
                autoplay
                playsinline
                class="w-full"
                style="display: block;"
                @touchstart="handleTouchStart"
                @touchmove="handleTouchMove"
                @touchend="handleTouchEnd"
              ></video>
              <canvas x-ref="canvas" class="hidden"></canvas>
            </div>
            
            <!-- コントロールエリア -->
            <div class="bg-gray-100 p-4 space-y-4">
              <!-- トーチ、デバッグ、ズームコントロール -->
              <div class="flex items-center justify-between">
                <!-- 左側: トーチとデバッグボタン -->
                <div class="flex items-center gap-3">
                  <!-- トーチボタン -->
                  <button
                    @click="toggleTorch"
                    class="p-3 rounded-full bg-gray-700 text-white hover:bg-gray-800 transition-all"
                    :class="{ 'bg-yellow-500 hover:bg-yellow-600': torchOn, 'opacity-30': !torchSupported }"
                    :title="torchSupported ? 'トーチ' : 'トーチはサポートされていません'"
                  >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                  </button>
                  
                  <!-- デバッグボタン -->
                  <button
                    @click="toggleDebug"
                    class="p-2 rounded-full bg-gray-600 text-white hover:bg-gray-700 transition-all opacity-60 hover:opacity-100"
                    :class="{ 'bg-blue-600 hover:bg-blue-700 opacity-100': showDebug }"
                    title="デバッグ"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"></path>
                    </svg>
                  </button>
                </div>
                
                <!-- 右側: ズームボタン -->
                <div class="flex gap-2" :class="{ 'opacity-30': availableZoomLevels.length <= 1 }">
                  <template x-for="level in availableZoomLevels" :key="level">
                    <button
                      @click="selectZoomLevel(level)"
                      :disabled="availableZoomLevels.length <= 1"
                      class="px-3 py-1 rounded-full text-sm font-medium transition-all disabled:cursor-not-allowed"
                      :class="Math.abs(currentZoomLevel - level) < 0.01 ? 
                        'bg-yellow-500 text-black' : 
                        'bg-gray-700 text-white hover:bg-gray-800 disabled:hover:bg-gray-700'"
                      x-text="level + 'x'"
                    >
                    </button>
                  </template>
                </div>
              </div>
              
            </div>
            
            <!-- 撮影/キャンセルボタン -->
            <div class="p-4 space-y-2 border-t border-gray-200">
              <button
                @click="capture"
                :disabled="isLoading"
                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              >
                撮影
              </button>
              <button
                @click="stopCamera"
                :disabled="isLoading"
                class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              >
                キャンセル
              </button>
            </div>
          </div>
        </div>
        
        <!-- カメラ起動ボタン -->
        <div x-show="!photo && !cameraActive" class="mb-4">
          <div class="bg-white rounded-lg shadow-md p-6">
            <p class="text-center text-gray-600 mb-4">レシートを撮影してください</p>
            
            <!-- 設定未完了時のメッセージ -->
            <div x-show="!checkSettingsComplete()" class="mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-md">
              <p class="text-sm text-yellow-800 text-center">
                設定を完了してからカメラを起動してください
              </p>
            </div>
            
            <button
              @click="startCamera"
              :disabled="isLoading || !checkSettingsComplete()"
              class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed mb-3"
            >
              <span x-show="!isLoading">カメラを起動</span>
              <span x-show="isLoading">起動中...</span>
            </button>
            
            <!-- 設定ボタン -->
            <button
              @click="openSettings"
              class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
            >
              <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              設定
            </button>
          </div>
        </div>
        
        <!-- 写真プレビュー -->
        <div x-show="photo" class="mb-4">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <img :src="photo" alt="撮影したレシート" class="w-full">
            <div class="p-4 space-y-2">
              <button
                @click="retake"
                class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
              >
                撮り直す
              </button>
              <button
                @click="sendMail"
                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded"
              >
                メールで送信
              </button>
            </div>
          </div>
        </div>
        
      </div>
      
      <!-- デバッグパネル -->
      <div id="debug-panel"></div>
      
      <!-- 設定モーダル -->
      <div id="settings-modal"></div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
