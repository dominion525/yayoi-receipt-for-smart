<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スマート レシート for 弥生</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;700&family=Raleway:wght@900&family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <meta name="description" content="レシートを撮影してメール送信。経理業務を効率化するWebアプリケーション。">
    <meta property="og:title" content="スマート レシート for 弥生">
    <meta property="og:description" content="レシートを撮影してメール送信。経理業務を効率化。">
    <meta property="og:url" content="https://receipt.dominion525.com">
    <link rel="canonical" href="https://receipt.dominion525.com">
  </head>
  <body>
    <div id="app" class="min-h-screen bg-gray-50" x-data="receiptApp" x-init="init()">
      <div class="container mx-auto px-4 py-8 max-w-lg">
        <div class="flex items-center justify-between mb-8">
          <!-- メインロゴ -->
          <div class="flex-1 text-center">
            <div class="inline-flex items-center gap-2">
              <span class="text-5xl p-3 bg-gradient-to-r from-gray-800 to-gray-600 text-white rounded">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
              </span>
              <div class="text-left">
                <div>
                  <span class="font-inter font-light text-3xl bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent">Smart</span>
                  <span class="font-inter font-light text-3xl bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent">Receipt</span>
                </div>
                <div class="mt-1">
                  <span class="text-xs bg-gradient-to-r from-gray-800 to-gray-600 text-white px-2 py-1 rounded">for Yayoi</span>
                </div>
              </div>
            </div>
          </div>
          <!-- デバッグボタン（常に表示） -->
          <button
            @click="toggleDebug"
            class="p-2 rounded-full bg-gray-600 text-white hover:bg-gray-700 transition-all"
            :class="{ 'bg-blue-600 hover:bg-blue-700': showDebug }"
            title="デバッグ情報"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"></path>
            </svg>
          </button>
        </div>
        
        <!-- エラーメッセージ -->
        <div x-show="error" x-transition class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded max-h-48 overflow-y-auto">
          <p x-html="error ? error.replace(/\n/g, '<br>') : ''" class="whitespace-pre-wrap"></p>
        </div>
        
        <!-- カメラビュー -->
        <div x-show="!photo && cameraActive" class="mb-4">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- ビデオエリア -->
            <div class="relative bg-black" style="min-height: 400px;">
              <video 
                x-ref="video"
                autoplay
                playsinline
                class="w-full"
                style="display: block;"
                @touchstart="handleTouchStart"
                @touchmove="handleTouchMove"
                @touchend="handleTouchEnd"
                :class="{ 'shutter-effect': showCaptureEffect }"
              ></video>
              <canvas x-ref="canvas" class="hidden"></canvas>
              
              <!-- キャプチャエフェクト -->
              <div
                x-show="showCaptureEffect"
                x-transition:enter="transition-opacity duration-200"
                x-transition:leave="transition-opacity duration-100"
                class="absolute inset-0 bg-white pointer-events-none camera-flash"
              ></div>
            </div>
            
            <!-- コントロールエリア -->
            <div class="bg-gray-100 p-4 space-y-4">
              <!-- トーチ、デバッグ、ズームコントロール -->
              <div class="flex items-center justify-between">
                <!-- 左側: トーチとデバッグボタン -->
                <div class="flex items-center gap-3">
                  <!-- トーチボタン -->
                  <button
                    @click="toggleTorch"
                    class="p-3 rounded-full bg-gray-700 text-white hover:bg-gray-800 transition-all"
                    :class="{ 'bg-yellow-500 hover:bg-yellow-600': torchOn, 'opacity-30': !torchSupported }"
                    :title="torchSupported ? 'トーチ' : 'トーチはサポートされていません'"
                  >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                  </button>
                  
                  <!-- デバッグボタン -->
                  <button
                    @click="toggleDebug"
                    class="p-2 rounded-full bg-gray-600 text-white hover:bg-gray-700 transition-all opacity-60 hover:opacity-100"
                    :class="{ 'bg-blue-600 hover:bg-blue-700 opacity-100': showDebug }"
                    title="デバッグ"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"></path>
                    </svg>
                  </button>
                </div>
                
                <!-- 右側: ズームボタン -->
                <div class="flex gap-2" :class="{ 'opacity-30': availableZoomLevels.length <= 1 }">
                  <template x-for="level in availableZoomLevels" :key="level">
                    <button
                      @click="selectZoomLevel(level)"
                      :disabled="availableZoomLevels.length <= 1"
                      class="px-3 py-1 rounded-full text-sm font-medium transition-all disabled:cursor-not-allowed"
                      :class="Math.abs(currentZoomLevel - level) < 0.01 ? 
                        'bg-yellow-500 text-black' : 
                        'bg-gray-700 text-white hover:bg-gray-800 disabled:hover:bg-gray-700'"
                      x-text="level + 'x'"
                    >
                    </button>
                  </template>
                </div>
              </div>
              
            </div>
            
            <!-- 撮影/キャンセルボタン -->
            <div class="p-4 space-y-2 border-t border-gray-200">
              <button
                @click="capture"
                :disabled="isLoading"
                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              >
                撮影
              </button>
              <button
                @click="stopCamera"
                :disabled="isLoading"
                class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              >
                キャンセル
              </button>
            </div>
          </div>
        </div>
        
        <!-- カメラ起動ボタン -->
        <div x-show="!photo && !cameraActive" class="mb-4">
          <div class="bg-white rounded-lg shadow-md p-6">
            <p class="text-center text-gray-600 mb-4">レシートを撮影してください</p>
            
            <!-- 設定未完了時のメッセージ -->
            <div x-show="!checkSettingsComplete()" class="mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-md">
              <p class="text-sm text-yellow-800 text-center">
                設定を完了してからカメラを起動してください
              </p>
            </div>
            
            <!-- 標準カメラで撮影ボタン（モバイル推奨） -->
            <input 
              x-ref="fileInput"
              type="file" 
              accept="image/*" 
              capture="environment"
              @change="handleNativeCamera"
              class="hidden"
            />
            
            <button
              @click="$refs.fileInput.click()"
              :disabled="!checkSettingsComplete()"
              class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed mb-2 flex items-center justify-center gap-2"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span>標準カメラで撮影</span>
              <span class="text-xs bg-blue-600 px-2 py-1 rounded">推奨</span>
            </button>
            
            <div class="text-center text-xs text-gray-500 mb-3">または</div>
            
            <button
              @click="startCamera"
              :disabled="isLoading || !checkSettingsComplete()"
              class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed mb-3"
            >
              <span x-show="!isLoading">アプリ内カメラを起動</span>
              <span x-show="isLoading">起動中...</span>
            </button>
            
            <!-- 設定ボタン -->
            <button
              @click="openSettings"
              class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
            >
              <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              設定
            </button>
          </div>
        </div>
        
        <!-- 写真プレビュー -->
        <div x-show="photo" class="mb-4">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="relative">
              <img :src="photo" alt="撮影したレシート" class="w-full">
              <!-- キャプチャエフェクト -->
              <div
                x-show="showCaptureEffect"
                x-transition:enter="transition-opacity duration-200"
                x-transition:leave="transition-opacity duration-100"
                class="absolute inset-0 bg-white pointer-events-none camera-flash"
              ></div>
            </div>
            <div class="p-4 space-y-2">
              <div class="grid grid-cols-2 gap-2">
                <button
                  @click="retake"
                  class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
                >
                  撮り直す
                </button>
                <button
                  @click="returnToHome"
                  class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
                >
                  ホームに戻る
                </button>
              </div>
              <!-- 送信先選択ボタン -->
              <div class="space-y-2">
                <template x-for="preset in settings.sendPresets.filter(p => p.isActive && p.recipients.length > 0)" :key="preset.id">
                  <button
                    :id="'send-btn-' + preset.id"
                    @click="sendMailToPreset(preset.id)"
                    :disabled="isSendingMail"
                    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                    :class="preset.id === 'all' ? 'bg-green-500 hover:bg-green-600' : ''"
                  >
                    <svg x-show="isSendingMail" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span x-text="isSendingMail ? '送信中...' : preset.name"></span>
                    <span class="text-xs opacity-75" x-text="'(' + preset.recipients.length + ')'"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
        
      </div>
      
      <!-- デバッグパネル -->
      <div id="debug-panel"></div>
      
      <!-- 設定モーダル -->
      <div id="settings-modal"></div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
