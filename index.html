<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スマート レシート for 弥生</title>
  </head>
  <body>
    <div id="app" class="min-h-screen bg-gray-50" x-data="receiptApp">
      <div class="container mx-auto px-4 py-8 max-w-lg">
        <h1 class="text-3xl font-bold text-center mb-8">スマート レシート for 弥生</h1>
        
        <!-- エラーメッセージ -->
        <div x-show="error" x-transition class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
          <p x-text="error"></p>
        </div>
        
        <!-- カメラビュー -->
        <div x-show="!photo && cameraActive" class="mb-4">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <!-- ビデオエリア -->
            <div class="relative">
              <video 
                x-ref="video"
                autoplay
                playsinline
                class="w-full"
                @touchstart="handleTouchStart"
                @touchmove="handleTouchMove"
                @touchend="handleTouchEnd"
              ></video>
              <canvas x-ref="canvas" class="hidden"></canvas>
            </div>
            
            <!-- コントロールエリア -->
            <div class="bg-gray-100 p-4 space-y-4">
              <!-- トーチとカメラ切り替え -->
              <div class="flex items-center justify-between">
                <!-- トーチボタン -->
                <button
                  @click="toggleTorch"
                  class="p-3 rounded-full bg-gray-700 text-white hover:bg-gray-800 transition-all"
                  :class="{ 'bg-yellow-500 hover:bg-yellow-600': torchOn, 'opacity-30': !torchSupported }"
                  :title="torchSupported ? 'トーチ' : 'トーチはサポートされていません'"
                >
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                  </svg>
                </button>
                
                <!-- カメラ切り替えボタン -->
                <div class="flex gap-2" :class="{ 'opacity-30': availableZooms.length <= 1 }">
                  <template x-for="zoom in availableZooms" :key="zoom">
                    <button
                      @click="selectZoom(zoom)"
                      :disabled="availableZooms.length <= 1"
                      class="px-3 py-1 rounded-full text-sm font-medium transition-all disabled:cursor-not-allowed"
                      :class="currentCamera && currentCamera.zoom === zoom ? 
                        'bg-yellow-500 text-black' : 
                        'bg-gray-700 text-white hover:bg-gray-800 disabled:hover:bg-gray-700'"
                      x-text="zoom + 'x'"
                    >
                    </button>
                  </template>
                </div>
              </div>
              
              <!-- ズームスライダー -->
              <div :class="{ 'opacity-30': !zoomSupported || !zoomCapabilities }">
                <div class="flex items-center gap-3">
                  <span class="text-gray-700 text-sm font-medium">1x</span>
                  <input
                    type="range"
                    :min="zoomCapabilities?.min || 1"
                    :max="zoomCapabilities?.max || 1"
                    :step="zoomCapabilities?.step || 0.1"
                    :value="currentZoom"
                    @input="updateZoom($event.target.value)"
                    :disabled="!zoomSupported || !zoomCapabilities"
                    class="flex-1 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
                    style="background-image: linear-gradient(to right, #fbbf24 0%, #fbbf24 var(--value), #e5e7eb var(--value), #e5e7eb 100%);"
                    :style="'--value: ' + ((currentZoom - (zoomCapabilities?.min || 1)) / ((zoomCapabilities?.max || 1) - (zoomCapabilities?.min || 1)) * 100) + '%'"
                  >
                  <span class="text-gray-700 text-sm font-medium" x-text="currentZoom.toFixed(1) + 'x'"></span>
                </div>
              </div>
            </div>
            
            <!-- 撮影/キャンセルボタン -->
            <div class="p-4 space-y-2 border-t border-gray-200">
              <button
                @click="capture"
                :disabled="isLoading"
                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              >
                撮影
              </button>
              <button
                @click="stopCamera"
                :disabled="isLoading"
                class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
              >
                キャンセル
              </button>
            </div>
          </div>
        </div>
        
        <!-- カメラ起動ボタン -->
        <div x-show="!photo && !cameraActive" class="mb-4">
          <div class="bg-white rounded-lg shadow-md p-6">
            <p class="text-center text-gray-600 mb-4">レシートを撮影してください</p>
            <button
              @click="startCamera"
              :disabled="isLoading"
              class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <span x-show="!isLoading">カメラを起動</span>
              <span x-show="isLoading">起動中...</span>
            </button>
          </div>
        </div>
        
        <!-- 写真プレビュー -->
        <div x-show="photo" class="mb-4">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <img :src="photo" alt="撮影したレシート" class="w-full">
            <div class="p-4 space-y-2">
              <button
                @click="retake"
                class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded"
              >
                撮り直す
              </button>
              <button
                @click="sendMail"
                class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded"
              >
                メールで送信
              </button>
            </div>
          </div>
        </div>
        
      </div>
      
      <!-- デバッグパネル -->
      <div id="debug-panel"></div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
