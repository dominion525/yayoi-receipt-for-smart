<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- ファビコン -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <title>スマート レシート</title>
    
    <!-- PWA設定 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#374151">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="スマートレシート">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&family=Poppins:wght@400;600&family=Montserrat:wght@400;700&family=Raleway:wght@900&family=Playfair+Display:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <meta name="description" content="レシートを撮影してメール送信。経理業務を効率化するWebアプリケーション。">
    <meta property="og:title" content="スマート レシート">
    <meta property="og:description" content="レシートを撮影してメール送信。経理業務を効率化。">
    <meta property="og:url" content="https://receipt.dominion525.com">
    <link rel="canonical" href="https://receipt.dominion525.com">
  </head>
  <body>
    <div id="app" class="min-h-screen bg-gray-50 flex flex-col" x-data="receiptApp" x-init="init()">
      <div class="container mx-auto px-4 pt-[calc(2rem+env(safe-area-inset-top))] pb-8 max-w-lg flex-grow pb-24">
        <div class="flex items-center justify-between" :class="photo ? 'mb-4' : 'mb-8'">
          <!-- メインロゴ -->
          <div class="flex-1 text-center">
            <div class="inline-flex items-center gap-2">
              <span class="text-5xl p-3 bg-gradient-to-r from-gray-800 to-gray-600 text-white rounded">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
              </span>
              <div class="text-left">
                <div>
                  <span class="font-inter font-light text-3xl bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent">Smart</span>
                  <span class="font-inter font-light text-3xl bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent">Receipt</span>
                </div>
                <div class="mt-1">
                  <span class="text-xs bg-gradient-to-r from-gray-800 to-gray-600 text-white px-2 py-1 rounded">Scan & Send</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- 成功メッセージ -->
        <div x-show="successMessage" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 transform -translate-y-2"
             x-transition:enter-end="opacity-100 transform translate-y-0"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform -translate-y-2"
             class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg shadow-md">
          <div class="flex items-center">
            <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p x-text="successMessage" class="font-medium"></p>
          </div>
        </div>
        
        <!-- エラーメッセージ -->
        <div x-show="error" x-transition class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded max-h-48 overflow-y-auto">
          <p x-html="error ? error.replace(/\n/g, '<br>') : ''" class="whitespace-pre-wrap"></p>
        </div>
        
        <!-- カメラ起動ボタン -->
        <div x-show="!photo" class="mb-4">
          <div class="bg-white rounded-lg shadow-md p-6">
            <p class="text-center text-gray-600 mb-4">レシートを撮影してください</p>
            
            <!-- 設定未完了時のメッセージ -->
            <div x-show="!isSettingsComplete" class="mb-4 p-3 bg-yellow-50 border border-yellow-200 rounded-md">
              <p class="text-sm text-yellow-800 text-center">
                設定を完了してからカメラを起動してください
              </p>
            </div>
            
            <!-- 標準カメラで撮影ボタン（モバイル推奨） -->
            <input 
              x-ref="fileInput"
              type="file" 
              accept="image/*" 
              capture="environment"
              @change="handleNativeCamera"
              class="hidden"
            />
            
            <button
              @click="$refs.fileInput.click()"
              :disabled="!isSettingsComplete"
              class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed mb-2 flex items-center justify-center gap-2 text-lg"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              <span>標準カメラで撮影</span>
              <span class="text-xs bg-blue-600 px-2 py-1 rounded">推奨</span>
            </button>
            
            <!-- 設定ボタン -->
            <button
              @click="openSettings"
              class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-4 px-4 rounded text-lg"
            >
              <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
              設定
            </button>
          </div>
        </div>
        
        <!-- 写真プレビュー -->
        <div x-show="photo" class="mb-2">
          <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="relative max-w-md mx-auto">
              <img :src="photo" alt="撮影したレシート" class="w-full h-auto max-h-96 object-contain bg-gray-50">
            </div>
            <div class="p-4 space-y-2">
              <button
                @click="retake"
                class="w-full bg-gray-500 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded text-base"
              >
                撮り直す
              </button>
              <!-- 送信ボタン -->
              <button
                @click="sendMail()"
                :disabled="isSendingMail || completionMessage"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-4 rounded disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-lg"
              >
                <svg x-show="isSendingMail" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <svg x-show="!isSendingMail" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span x-text="isSendingMail ? '送信中...' : '送信する'"></span>
              </button>
            </div>
          </div>
        </div>
        
        <!-- 送信進捗表示 / 完了メッセージ -->
        <div x-show="(sendProgress && isSendingMail) || completionMessage" x-transition class="mb-4">
          <div class="bg-white rounded-lg shadow-md p-4">
            <!-- 完了メッセージ -->
            <div x-show="completionMessage" class="flex items-center justify-center py-2">
              <svg class="w-6 h-6 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <p x-text="completionMessage" class="text-lg font-medium text-green-700"></p>
            </div>
            
            <!-- プログレスバー表示 -->
            <div x-show="sendProgress && isSendingMail">
            <div class="mb-3">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-medium text-gray-700">送信進捗</span>
                <span class="text-sm font-medium text-gray-700">
                  <span x-text="sendProgress?.sent || 0"></span> / <span x-text="sendProgress?.total || 0"></span> 件完了
                </span>
              </div>
              <!-- プログレスバー -->
              <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div 
                  class="bg-blue-600 h-2.5 rounded-full transition-all duration-300"
                  :style="`width: ${sendProgress?.percentage || 0}%`"
                ></div>
              </div>
            </div>
            
            <!-- 現在送信中の宛先表示 -->
            <div x-show="sendProgress?.currentRecipients?.length > 0" class="text-sm text-gray-600">
              <div class="font-medium mb-1">送信中:</div>
              <template x-for="recipient in sendProgress?.currentRecipients?.slice(0, 3)" :key="recipient">
                <div class="pl-3 truncate">
                  <svg class="w-3 h-3 inline mr-1 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  <span x-text="recipient"></span>
                </div>
              </template>
              <div x-show="sendProgress?.currentRecipients?.length > 3" class="pl-3 text-gray-500">
                他 <span x-text="sendProgress.currentRecipients.length - 3"></span> 件...
              </div>
            </div>
            
            <!-- 失敗がある場合の表示 -->
            <div x-show="sendProgress?.failed > 0" class="mt-2 text-sm text-red-600">
              <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <span x-text="sendProgress.failed"></span> 件の送信失敗
            </div>
            </div>
          </div>
        </div>
        
      </div>
      
      <!-- デバッグパネル -->
      <div id="debug-panel"></div>
      
      <!-- 設定モーダル -->
      <div id="settings-modal"></div>
      
      <!-- フッター -->
      <div id="footer"></div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
    
    <!-- Service Worker登録 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => console.log('SW registered:', registration))
            .catch(error => console.log('SW registration failed:', error));
        });
      }
    </script>
  </body>
</html>
