<!-- 設定モーダル -->
<div
  x-show="showSettings"
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-start justify-center z-50 pt-10 pb-10 overflow-y-auto"
  @click.self="closeSettings"
  @keydown.escape.window="showSettings && closeSettings()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="settings-title"
>
  <div
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 p-6 max-h-[90vh] overflow-y-auto"
    @click.stop
  >
    <!-- ヘッダー -->
    <div class="flex items-center justify-between mb-6">
      <h2 id="settings-title" class="text-xl font-bold text-gray-900">設定</h2>
      <button
        @click="closeSettings"
        class="p-1 rounded-full hover:bg-gray-100 transition-colors"
        title="閉じる"
        aria-label="設定を閉じる"
      >
        <svg
          class="w-6 h-6 text-gray-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- フォーム -->
    <form @submit.prevent="saveSettings" class="space-y-4">
      <!-- 送信先メールアドレス -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          送信先メールアドレス
        </label>
        <input
          id="email"
          type="email"
          x-model="tempSettings.email"
          placeholder="example@example.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
          style="touch-action: manipulation; -webkit-appearance: none"
          required
        />
      </div>

      <!-- Dropboxメールアドレス -->
      <div>
        <label for="dropboxEmail" class="block text-sm font-medium text-gray-700 mb-1">
          Dropbox Email-to-Dropbox
        </label>
        <input
          id="dropboxEmail"
          type="email"
          x-model="tempSettings.dropboxEmail"
          placeholder="xxxx@getdropbox.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
          style="touch-action: manipulation; -webkit-appearance: none"
        />
        <p class="mt-1 text-xs text-gray-500">Dropboxの専用メールアドレス（オプション）</p>
      </div>

      <!-- RESEND APIキー -->
      <div>
        <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">
          RESEND APIキー
        </label>
        <input
          id="apiKey"
          type="password"
          x-model="tempSettings.apiKey"
          placeholder="re_xxxxxxxxxxxxxxxxxxxxxxxx"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
          style="touch-action: manipulation; -webkit-appearance: none"
          required
        />
        <p class="mt-1 text-xs text-gray-500">
          <template x-if="settings.apiKey">
            <span>保存済み: <span x-text="maskedSavedApiKey" class="font-mono"></span></span>
          </template>
          <template x-if="!settings.apiKey">
            <span>RESENDのAPIキーを入力してください</span>
          </template>
        </p>
      </div>

      <!-- 認証済みメールアドレス -->
      <div>
        <label for="fromEmail" class="block text-sm font-medium text-gray-700 mb-1">
          認証済みメールアドレス（送信元）
        </label>
        <input
          id="fromEmail"
          type="email"
          x-model="tempSettings.fromEmail"
          placeholder="your-email@yourdomain.com"
          class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-base"
          style="touch-action: manipulation; -webkit-appearance: none"
          required
        />
        <p class="mt-1 text-xs text-gray-500">RESENDで認証済みのドメインのメールアドレス</p>
      </div>

      <!-- アクションボタン -->
      <div class="flex gap-3 pt-4">
        <button
          type="button"
          @click="closeSettings"
          class="flex-1 px-4 py-3 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-colors text-base font-medium"
          style="touch-action: manipulation"
        >
          キャンセル
        </button>
        <button
          type="submit"
          class="flex-1 px-4 py-3 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-base font-medium"
          style="touch-action: manipulation"
        >
          保存
        </button>
      </div>
    </form>
  </div>
</div>
