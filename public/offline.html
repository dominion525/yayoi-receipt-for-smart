<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オフライン - スマート レシート</title>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .offline-container {
        text-align: center;
        max-width: 400px;
      }
      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #374151 0%, #6b7280 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 48px;
        height: 48px;
        stroke: white;
        fill: none;
      }
      h1 {
        color: #1f2937;
        font-size: 24px;
        margin: 0 0 10px;
      }
      p {
        color: #6b7280;
        font-size: 16px;
        line-height: 1.6;
        margin: 0 0 20px;
      }
      .retry-button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
      }
      .retry-button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"
          ></path>
        </svg>
      </div>
      <h1>インターネット接続がありません</h1>
      <p>
        スマート
        レシートを使用するにはインターネット接続が必要です。接続を確認してから再度お試しください。
      </p>
      <button id="retry-button" class="retry-button">再読み込み</button>
    </div>
    <script src="/offline.js"></script>
  </body>
</html>
