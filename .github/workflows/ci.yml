name: CI

on:
  push:
    branches: [main, feat/*, feature/*, refactor/*, fix/*, chore/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    env:
      TZ: Asia/Tokyo # タイムゾーンを明示的にJSTに設定

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (frontend)
        run: npx tsc --noEmit

      - name: Type check (worker)
        run: npx tsc -p tsconfig.worker.json --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check bundle size
        run: |
          MAX_BYTES=500000
          ACTUAL_BYTES=$(du -sb dist | awk '{print $1}')
          echo "dist size: ${ACTUAL_BYTES} bytes (limit: ${MAX_BYTES} bytes)"
          if [ "${ACTUAL_BYTES}" -gt "${MAX_BYTES}" ]; then
            echo "::error::dist directory size ${ACTUAL_BYTES} bytes exceeds limit ${MAX_BYTES} bytes"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
